            { formClass: 'P4-I', mtClass: '4CL5', name: 'TONG PEI YI CLARE' },
            { formClass: 'P4-I', mtClass: '4CL5', name: 'WONG MIN EN, MIKAYLA' },
            { formClass: 'P4-I', mtClass: '4CL5', name: 'YEO YU KAI ALDRICH' },
            { formClass: 'P4-I', mtClass: '4CL5', name: 'YEW YU HAN CHARLOTTE' },
            { formClass: 'P4-I', mtClass: '4CL5', name: 'CHEN XINRAN' },
            { formClass: 'P4-H', mtClass: '4CL5', name: 'HUANG YIYANG' },
            { formClass: 'P4-H', mtClass: '4CL5', name: 'SU RUINING' },

            // 4CL6
            { formClass: 'P4-E', mtClass: '4CL6', name: 'ALOYSIUS ONG KAI SHENG' },
            { formClass: 'P4-E', mtClass: '4CL6', name: 'NICOLAS LIM YUAN HE' },
            { formClass: 'P4-H', mtClass: '4CL6', name: 'SIENNA WEE SHI EN' },
            { formClass: 'P4-I', mtClass: '4CL6', name: 'NATHANIA OEY' },
            { formClass: 'P4-I', mtClass: '4CL6', name: 'YANG XIANZHI HOWARD' },
            { formClass: 'P4-I', mtClass: '4CL6', name: 'TIO WEN LE' },
            { formClass: 'P4-RS', mtClass: '4CL6', name: 'ALEXANDER LEE YE JUN' },
            { formClass: 'P4-RS', mtClass: '4CL6', name: 'CHEE YU ZHI' },
            { formClass: 'P4-RS', mtClass: '4CL6', name: 'CHOI KIAN YONG' },
            { formClass: 'P4-RS', mtClass: '4CL6', name: 'THONG JIEMING JAVEN' },
        ];

        const App = () => {
            const [student, setStudent] = useState({ formClass: '', mtClass: '', name: '' });
            const [scores, setScores] = useState({
                readingPron: 0, readingFluency: 0,
                pictureContent: 0, pictureLanguage: 0,
                convResponse: 0, convLanguage: 0
            });
            const [selections, setSelections] = useState({
                readingPron: null, readingFluency: null,
                pictureContent: null, pictureLanguage: null,
                convResponse: null, convLanguage: null
            });
            
            const [feedbackText, setFeedbackText] = useState('');
            const [lastAutoText, setLastAutoText] = useState('');

            // Updated Google Apps Script Web App URL
            const gasUrl = 'https://script.google.com/macros/s/AKfycbyhqrXZhmKxDNly6dv8gQwJ_eIEGHQhRb5vpTAA_ypNlAyVRBuHO75f7ssOHbkmq2IS8Q/exec';

            const [submitStatus, setSubmitStatus] = useState('idle');
            const [currentExaminer, setCurrentExaminer] = useState('');
            const [dialog, setDialog] = useState({ isOpen: false, title: '', message: '', type: 'alert', onConfirm: null, isSuccess: false });

            // Extract unique Form Classes
            const formClasses = useMemo(() => {
                return Array.from(new Set(defaultRoster.map(s => s.formClass))).sort();
            }, []);

            // Dynamically filter MT Classes based on chosen Form Class
            const availableMtClasses = useMemo(() => {
                if (!student.formClass) return [];
                const filtered = defaultRoster.filter(s => s.formClass === student.formClass);
                return Array.from(new Set(filtered.map(s => s.mtClass))).sort();
            }, [student.formClass]);

            // Dynamically filter Students based on chosen Form Class AND MT Class
            const filteredStudents = useMemo(() => {
                if (!student.formClass || !student.mtClass) return [];
                return defaultRoster.filter(s => s.formClass === student.formClass && s.mtClass === student.mtClass);
            }, [student.formClass, student.mtClass]);

            const readingTotal = Number(scores.readingPron) + Number(scores.readingFluency);
            const pictureTotal = Number(scores.pictureContent) + Number(scores.pictureLanguage);
            const convTotal = Number(scores.convResponse) + Number(scores.convLanguage);
            const grandTotal = readingTotal + pictureTotal + convTotal;

            const generatedReadingFB = useMemo(() => {
                let fb = [];
                if (selections.readingPron !== null) fb.push(rubricsData.readingPron.items[selections.readingPron].feedback);
                if (selections.readingFluency !== null) fb.push(rubricsData.readingFluency.items[selections.readingFluency].feedback);
                return fb.join(" ");
            }, [selections]);

            const generatedPictureFB = useMemo(() => {
                let fb = [];
                if (selections.pictureContent !== null) fb.push(rubricsData.pictureContent.items[selections.pictureContent].feedback);
                if (selections.pictureLanguage !== null) fb.push(rubricsData.pictureLanguage.items[selections.pictureLanguage].feedback);
                return fb.join(" ");
            }, [selections]);

            const generatedConvFB = useMemo(() => {
                let fb = [];
                if (selections.convResponse !== null) fb.push(rubricsData.convResponse.items[selections.convResponse].feedback);
                if (selections.convLanguage !== null) fb.push(rubricsData.convLanguage.items[selections.convLanguage].feedback);
                return fb.join(" ");
            }, [selections]);

            const generatedFeedback = useMemo(() => {
                let parts = [];
                if (generatedReadingFB) parts.push(`【朗读短文】\n${generatedReadingFB}`);
                if (generatedPictureFB) parts.push(`【看图说话】\n${generatedPictureFB}`);
                if (generatedConvFB) parts.push(`【会话】\n${generatedConvFB}`);
                return parts.join("\n\n");
            }, [generatedReadingFB, generatedPictureFB, generatedConvFB]);

            useEffect(() => {
                setFeedbackText((currentText) => {
                    if (!currentText || currentText === lastAutoText) {
                        return generatedFeedback;
                    }
                    if (lastAutoText && currentText.includes(lastAutoText)) {
                        return currentText.replace(lastAutoText, generatedFeedback);
                    }
                    return generatedFeedback;
                });
                setLastAutoText(generatedFeedback);
            }, [generatedFeedback]);

            const clearScores = () => {
                setScores({ readingPron: 0, readingFluency: 0, pictureContent: 0, pictureLanguage: 0, convResponse: 0, convLanguage: 0 });
                setSelections({ readingPron: null, readingFluency: null, pictureContent: null, pictureLanguage: null, convResponse: null, convLanguage: null });
                setFeedbackText('');
            };

            const handleSelect = (category, itemIndex, selectedScore) => {
                setSelections(prev => ({ ...prev, [category]: itemIndex }));
                setScores(prev => ({ ...prev, [category]: selectedScore }));
            };

            const handleScoreChange = (category, value) => {
                let num = parseInt(value) || 0;
                if (num > rubricsData[category].max) num = rubricsData[category].max;
                setScores(prev => ({ ...prev, [category]: num }));
                setSelections(prev => ({ ...prev, [category]: null })); 
            };

            const handleExaminerChange = (e) => {
                const val = e.target.value;
                setCurrentExaminer(val);
            };

            const handlePrint = () => {
                const originalTitle = document.title;
                const fileName = student.name ? `P4_${student.formClass}_${student.mtClass}_${student.name}_口试反馈` : `P4_口试反馈单`;
                document.title = fileName;
                window.print();
                setTimeout(() => { document.title = originalTitle; }, 500);
            };

            const [lastSubmittedKey, setLastSubmittedKey] = useState('');

            const submitAssessment = async () => {
                setSubmitStatus('loading');
                const payload = {
                    level: 'P4',
                    formClass: student.formClass,
                    mtClass: student.mtClass,
                    className: student.mtClass,
                    studentName: student.name,
                    examiner: currentExaminer,
                    readingScore: readingTotal,
                    pictureScore: pictureTotal,
                    convScore: convTotal,
                    totalScore: grandTotal,
                    maxTotal: 30,
                    feedback: feedbackText,
                    timestamp: new Date().toLocaleString('zh-CN', { hour12: false })
                };
                try {
                    await fetch(gasUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    setLastSubmittedKey(`P4|${student.mtClass}|${student.name}`);
                    setSubmitStatus('idle');
                    setDialog({ isOpen: true, title: '✅ 提交成功！', message: `考生 ${student.name} (${student.formClass} / ${student.mtClass}) 的成绩（${grandTotal}/30）已发送至云端，请检查 Google Sheet。`, type: 'alert', isSuccess: true });
                } catch (error) {
                    setSubmitStatus('idle');
                    setDialog({ isOpen: true, title: '提交失败', message: '网络连接出现问题，请检查网络或部署网址。', type: 'alert' });
                }
            };

            const showDuplicateWarning = (details = '') => {
                setSubmitStatus('idle');
                setDialog({
                    isOpen: true,
                    title: '⚠️ 成绩已提交',
                    message: `这名考生的成绩已经提交过。${details ? '\n' + details : ''}\n\n请选择“取消”停止提交，或“继续提交”再次提交成绩。`,
                    type: 'confirm',
                    confirmText: '继续提交',
                    cancelText: '取消',
                    onConfirm: submitAssessment
                });
            };

            // Duplicate check with automatic retry. This reduces false warnings caused by
            // brief Wi-Fi / Apps Script delays during the oral examination.
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            const checkDuplicateWithRetry = async (maxAttempts = 3) => {
                let lastError = null;

                for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000);

                    try {
                        const checkUrl = `${gasUrl}?action=check&level=${encodeURIComponent('P4')}&mtClass=${encodeURIComponent(student.mtClass)}&studentName=${encodeURIComponent(student.name)}&_=${Date.now()}`;
                        const response = await fetch(checkUrl, {
                            method: 'GET',
                            cache: 'no-store',
                            signal: controller.signal
                        });

                        if (!response.ok) {
                            throw new Error(`Duplicate check returned HTTP ${response.status}`);
                        }

                        const text = await response.text();
                        let result;
                        try {
                            result = JSON.parse(text);
                        } catch (e) {
                            throw new Error('Duplicate check returned an invalid response');
                        }

                        if (!result || result.ok === false) {
                            throw new Error((result && result.error) || 'Duplicate check failed');
                        }

                        clearTimeout(timeoutId);
                        return result;
                    } catch (error) {
                        clearTimeout(timeoutId);
                        lastError = error;
                        if (attempt < maxAttempts) {
                            // Small increasing delay before retrying: 0.8s, then 1.6s.
                            await sleep(800 * attempt);
                        }
                    }
                }

                throw lastError || new Error('Duplicate check failed');
            };

            const handleSubmitGAS = async () => {
                if (!student.formClass || !student.mtClass || !student.name || !currentExaminer) {
                    setDialog({ isOpen: true, title: '提示', message: '请确保选择级任班、母语班、考生及主考老师。', type: 'alert' });
                    return;
                }

                const submissionKey = `P4|${student.mtClass}|${student.name}`;
                if (lastSubmittedKey === submissionKey) {
                    showDuplicateWarning(`本页面刚刚已为 ${student.name} 提交过一次。`);
                    return;
                }

                setSubmitStatus('loading');
                try {
                    const result = await checkDuplicateWithRetry(3);
                    if (result && result.exists) {
                        const prev = result.previous || {};
                        const info = `上一次主考老师：${prev.examiner || '未记录'}；提交时间：${prev.timestamp || '未记录'}。`;
                        showDuplicateWarning(info);
                        return;
                    }
                    await submitAssessment();
                } catch (error) {
                    setSubmitStatus('idle');
                    setDialog({
                        isOpen: true,
                        title: '暂时无法连接成绩系统',
                        message: '系统已自动重试 3 次，但仍无法完成重复记录检查。为避免重复提交，请检查网络后再按“提交成绩”。已输入的分数和评语不会被清除。',
                        type: 'alert'
                    });
                }
            };

            const resetForm = () => {
                setDialog({
                    isOpen: true,
                    title: '确认重置',
                    message: '确定要清空当前分数和评语，准备给下一位考生打分吗？',
                    type: 'confirm',
                    onConfirm: () => {
                        setStudent(prev => ({ ...prev, name: '' }));
                        clearScores();
                    }
                });
            };

            const renderRubricRow = (categoryKey) => {
                const rubricObj = rubricsData[categoryKey];
                return (
                    <div className="mb-6 bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 no-print">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
                            <h3 className="font-bold text-lg md:text-xl text-slate-800">
                                {rubricObj.title} <span className="text-slate-400 text-base font-medium">({rubricObj.max}分)</span>
                            </h3>
                            <div className="flex items-center space-x-3 bg-blue-50 px-4 py-1.5 rounded-xl border border-blue-200 w-full md:w-auto justify-between md:justify-start">
                                <span className="text-sm md:text-base text-blue-900 font-bold">得分:</span>
                                <div className="flex items-baseline">
                                    <input 
                                        type="number" 
                                        min="0" max={rubricObj.max}
                                        value={scores[categoryKey]} 
                                        onChange={(e) => handleScoreChange(categoryKey, e.target.value)}
                                        className="w-12 text-center font-black text-2xl text-blue-700 bg-transparent border-b-2 border-blue-300 focus:outline-none focus:border-blue-700 transition-colors"
                                    />
                                    <span className="text-slate-500 font-medium ml-1">/{rubricObj.max}</span>
                                </div>
                            </div>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3">
                            {rubricObj.items.map((item, index) => {
                                const isSelected = selections[categoryKey] === index;
                                return (
                                    <div 
                                        key={index}
                                        onClick={() => handleSelect(categoryKey, index, item.score)}
                                        className={`cursor-pointer rounded-xl p-3 transition-all duration-200 border-2 flex flex-col justify-between ${
                                            isSelected 
                                            ? 'border-blue-600 bg-blue-50 shadow-md ring-2 ring-blue-200 scale-[1.01]' 
                                            : 'border-slate-200 hover:border-blue-300 hover:bg-slate-50'
                                        }`}
                                    >
                                        <div>
                                            <div className="flex justify-between items-center mb-1">
                                                <span className={`font-black text-base ${isSelected ? 'text-blue-700' : 'text-slate-800'}`}>
                                                    {item.label}
                                                </span>
                                                <button
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        handleSelect(categoryKey, index, item.score);
                                                    }}
                                                    className={`w-7 h-7 rounded-lg text-xs font-black transition-all ${
                                                        isSelected 
                                                        ? 'bg-blue-600 text-white' 
                                                        : 'bg-slate-100 text-slate-600 hover:bg-blue-100'
                                                    }`}
                                                >
                                                    {item.score}分
                                                </button>
                                            </div>
                                            <p className={`text-xs leading-relaxed ${isSelected ? 'text-blue-900 font-medium' : 'text-slate-500'}`}>
                                                {item.desc}
                                            </p>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-6 lg:p-8">
                    {dialog.isOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm px-4 no-print">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all border border-slate-200">
                                <div className={`p-8 ${dialog.isSuccess ? 'bg-green-50 text-center' : ''}`}>
                                    {dialog.isSuccess && <div className="text-6xl mb-4">🎉</div>}
                                    <h3 className={`font-black text-2xl mb-2 ${dialog.isSuccess ? 'text-green-800' : 'text-slate-900'}`}>
                                        {dialog.title || '提示'}
                                    </h3>
                                    <p className={`leading-relaxed text-base ${dialog.isSuccess ? 'text-green-900 font-medium' : 'text-slate-600'}`}>
                                        {dialog.message}
                                    </p>
                                </div>
                                <div className="p-4 bg-slate-50 border-t border-slate-100 flex justify-center space-x-3">
                                    {dialog.type === 'confirm' && (
                                        <button 
                                            onClick={() => setDialog({ ...dialog, isOpen: false })} 
                                            className="px-6 py-2.5 text-slate-600 font-bold text-base hover:bg-slate-200 rounded-xl transition-colors w-full"
                                        >
                                            {dialog.cancelText || '取消'}
                                        </button>
                                    )}
                                    <button 
                                        onClick={() => { 
                                            if(dialog.onConfirm) dialog.onConfirm(); 
                                            setDialog({ ...dialog, isOpen: false, isSuccess: false }); 
                                        }} 
                                        className={`px-6 py-2.5 text-white font-black text-base rounded-xl shadow-md transition-colors w-full ${dialog.isSuccess ? 'bg-green-600 hover:bg-green-700' : 'bg-blue-600 hover:bg-blue-700'}`}
                                    >
                                        {dialog.confirmText || '确定'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TOP NAVIGATION / HEADER BAR */}
                    <div className="sticky top-0 z-10 bg-white/95 backdrop-blur-xl shadow-md border-b border-slate-200 rounded-2xl p-4 mb-6 flex flex-col no-print gap-4">
                        
                        {/* LINE 1: BIG HEADING (MODIFIED AS REQUESTED) */}
                        <div className="flex items-center justify-between">
                            <span className="text-3xl font-black text-indigo-700 tracking-tight">
                                雅德小学四年级华文口试
                            </span>
                        </div>

                        {/* LINE 2: DROPDOWNS & SCORES (MATCHING ATTACHED IMAGE FORMAT) */}
                        <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 border-t border-slate-100 pt-3">
                            <div className="flex flex-wrap items-center gap-3 text-slate-600 font-bold text-sm">
                                
                                {/* 1. 级任班 Dropdown */}
                                <div className="flex items-center space-x-1.5">
                                    <span>级任班:</span>
                                    <select 
                                        value={student.formClass} 
                                        onChange={e => setStudent({ formClass: e.target.value, mtClass: '', name: '' })}
                                        className="border border-slate-200 rounded-2xl px-4 py-2 bg-slate-50/60 focus:bg-white focus:ring-2 focus:ring-blue-500/20 outline-none font-bold text-slate-800 cursor-pointer shadow-sm text-sm"
                                    >
                                        <option value="">- 选择 -</option>
                                        {formClasses.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>

                                {/* 2. 母语班 Dropdown */}
                                <div className="flex items-center space-x-1.5">
                                    <span>母语班:</span>
                                    <select 
                                        value={student.mtClass} 
                                        disabled={!student.formClass}
                                        onChange={e => setStudent({ ...student, mtClass: e.target.value, name: '' })}
                                        className="border border-slate-200 rounded-2xl px-4 py-2 bg-slate-50/60 focus:bg-white focus:ring-2 focus:ring-blue-500/20 outline-none font-bold text-slate-800 cursor-pointer shadow-sm text-sm disabled:bg-slate-100 disabled:cursor-not-allowed"
                                    >
                                        <option value="">- 选择 -</option>
                                        {availableMtClasses.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                
                                {/* 3. 考生 Dropdown */}
                                <div className="flex items-center space-x-1.5">
                                    <span>考生:</span>
                                    <select 
                                        value={student.name} 
                                        disabled={!student.mtClass}
                                        onChange={e => setStudent({ ...student, name: e.target.value })}
                                        className="border border-slate-200 rounded-2xl px-4 py-2 bg-slate-50/60 focus:bg-white focus:ring-2 focus:ring-blue-500/20 outline-none font-bold text-blue-600 cursor-pointer shadow-sm text-sm disabled:bg-slate-100 disabled:cursor-not-allowed min-w-[160px]"
                                    >
                                        <option value="">- 选择 -</option>
                                        {filteredStudents.map((s, i) => <option key={i} value={s.name}>{s.name}</option>)}
                                    </select>
                                </div>

                                {/* Vertical Line Divider */}
                                <div className="h-6 w-[1.5px] bg-slate-200 mx-1 hidden md:block"></div>

                                {/* 4. 主考老师 Dropdown */}
                                <div className="flex items-center space-x-1.5">
                                    <span className="text-purple-700 font-bold">主考老师:</span>
                                    <select 
                                        value={currentExaminer}
                                        onChange={handleExaminerChange}
                                        className="border border-purple-200 rounded-2xl px-4 py-2 bg-purple-50/40 focus:bg-white focus:ring-2 focus:ring-purple-500/20 outline-none font-bold text-purple-900 cursor-pointer shadow-sm text-sm"
                                    >
                                        <option value="">- 选择 -</option>
                                        {examinersList.map(t => <option key={t} value={t}>{t}</option>)}
                                    </select>
                                </div>
                            </div>

                            {/* LIVE TOTAL SCORE DISPLAY */}
                            <div className="flex items-center justify-end space-x-4 w-full xl:w-auto bg-slate-50 xl:bg-transparent p-2 xl:p-0 rounded-xl">
                                <div className="text-center px-2">
                                    <div className="text-xs text-slate-500 font-bold">朗读</div>
                                    <div className="font-black text-lg text-indigo-600">{readingTotal}<span className="text-xs text-slate-400 font-normal">/10</span></div>
                                </div>
                                <div className="text-center px-2">
                                    <div className="text-xs text-slate-500 font-bold">看图</div>
                                    <div className="font-black text-lg text-indigo-600">{pictureTotal}<span className="text-xs text-slate-400 font-normal">/10</span></div>
                                </div>
                                <div className="text-center px-2">
                                    <div className="text-xs text-slate-500 font-bold">会话</div>
                                    <div className="font-black text-lg text-indigo-600">{convTotal}<span className="text-xs text-slate-400 font-normal">/10</span></div>
                                </div>
                                <div className="text-center px-5 py-1.5 rounded-2xl shadow-md bg-blue-600 text-white">
                                    <div className="text-xs font-bold opacity-80">总分</div>
                                    <div className="font-black text-2xl leading-none">{grandTotal}<span className="text-xs font-normal opacity-80 ml-0.5">/30</span></div>
                                </div>
                            </div>
                        </div>

                    </div>

                    {/* PRINT SLIP CONTAINER */}
                    <div className="print-only print-container">
                        <div className="text-center mb-6 border-b-2 border-slate-200 pb-4">
                            {/* DYNAMIC PRINT TITLE & HEADING */}
                            <h1 className="text-2xl font-black text-slate-900 mb-1 tracking-wide">
                                🌟 雅德小学四年级华文口试反馈单 🌟
                            </h1>
                            <div className="flex justify-center gap-6 text-base text-slate-700 font-medium mt-3">
                                <span>级任班：<strong className="text-slate-900 font-black">{student.formClass || "未选择"}</strong></span>
                                <span>母语班：<strong className="text-slate-900 font-black">{student.mtClass || "未选择"}</strong></span>
                                <span>姓名：<strong className="text-slate-900 font-black">{student.name || "未填写"}</strong></span>
                            </div>
                        </div>
                        
                        <div className="flex justify-center items-center gap-3 mb-6">
                            <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 w-28 text-center">
                                <div className="text-slate-500 font-bold text-xs mb-1">朗读短文</div>
                                <div className="text-xl font-black text-slate-800">{readingTotal} <span className="text-xs font-normal text-slate-400">/ 10</span></div>
                            </div>
                            <div className="text-xl text-slate-300">+</div>
                            <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 w-28 text-center">
                                <div className="text-slate-500 font-bold text-xs mb-1">看图说话</div>
                                <div className="text-xl font-black text-slate-800">{pictureTotal} <span className="text-xs font-normal text-slate-400">/ 10</span></div>
                            </div>
                            <div className="text-xl text-slate-300">+</div>
                            <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 w-28 text-center">
                                <div className="text-slate-500 font-bold text-xs mb-1">会话</div>
                                <div className="text-xl font-black text-slate-800">{convTotal} <span className="text-xs font-normal text-slate-400">/ 10</span></div>
                            </div>
                            <div className="text-xl text-slate-300">=</div>
                            <div className="border-2 bg-blue-50 border-blue-200 rounded-xl p-3 w-32 text-center shadow-sm">
                                <div className="font-bold text-xs text-blue-700 mb-1">本次总分</div>
                                <div className="text-3xl font-black text-blue-800">{grandTotal} <span className="text-sm text-blue-500">/ 30</span></div>
                            </div>
                        </div>

                        <div className="mb-6">
                            <h2 className="text-lg font-black text-slate-900 mb-2 flex items-center">
                                <span className="w-6 h-6 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center mr-2 text-xs">💡</span> 
                                老师对你说：
                            </h2>
                            <div className="bg-slate-50 border border-slate-200 rounded-xl p-5 text-base text-slate-800 leading-relaxed font-medium whitespace-pre-wrap min-h-[140px]">
                                {feedbackText || "老师还没有完成评分哦。"}
                            </div>
                        </div>
                        
                        <div className="text-center mt-8 text-slate-400 font-bold text-base tracking-widest">
                            继续加油！期待你下一次更精彩的表现！🚀
                        </div>
                    </div>

                    {/* MAIN INTERFACE RUBRICS */}
                    <div className="no-print">
                        <div className="mb-8">
                            <h2 className="text-xl font-black text-slate-800 mb-4 px-3 border-l-4 border-blue-600 rounded-sm">
                                第一部分：朗读短文 (10分)
                            </h2>
                            {renderRubricRow('readingPron')}
                            {renderRubricRow('readingFluency')}
                        </div>

                        <div className="mb-8">
                            <h2 className="text-xl font-black text-slate-800 mb-4 px-3 border-l-4 border-emerald-500 rounded-sm">
                                第二部分：看图说话 (10分)
                            </h2>
                            {renderRubricRow('pictureContent')}
                            {renderRubricRow('pictureLanguage')}
                        </div>

                        <div className="mb-8">
                            <h2 className="text-xl font-black text-slate-800 mb-4 px-3 border-l-4 border-indigo-600 rounded-sm">
                                第三部分：会话 (10分)
                            </h2>
                            {renderRubricRow('convResponse')}
                            {renderRubricRow('convLanguage')}
                        </div>

                        <div className="mt-8 p-6 rounded-2xl border-2 border-blue-100 bg-blue-50/40 shadow-sm">
                            <h3 className="font-black text-lg mb-3 text-blue-900 flex items-center justify-between">
                                <span>📝 自动生成评语预览</span>
                                <span className="text-xs font-normal text-blue-600 bg-blue-100 px-3 py-1 rounded-full">
                                    可直接点击文本框随意修改、添加评语
                                </span>
                            </h3>
                            <textarea 
                                className="w-full h-40 p-4 rounded-xl border-2 border-blue-200 focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none resize-none text-slate-800 text-base leading-relaxed bg-white shadow-inner"
                                value={feedbackText}
                                onChange={(e) => setFeedbackText(e.target.value)}
                                placeholder="点击上方表格评分，此处会自动生成评语..."
                            ></textarea>
                            
                            <div className="flex flex-col md:flex-row justify-between items-center mt-6 gap-4">
                                <button 
                                    onClick={resetForm} 
                                    className="flex items-center text-slate-600 bg-white hover:bg-slate-100 border border-slate-300 font-bold text-sm px-5 py-2.5 rounded-xl transition-all shadow-sm"
                                >
                                    🔄 清空重置
                                </button>
                                
                                <div className="flex space-x-3 w-full md:w-auto">
                                    <button 
                                        onClick={handlePrint}
                                        className="flex-1 md:flex-none bg-white border-2 border-slate-300 hover:border-slate-400 text-slate-800 px-5 py-2.5 rounded-xl font-bold text-sm shadow-sm transition-all"
                                    >
                                        🖨️ 打印/保存 PDF
                                    </button>
                                    <button 
                                        onClick={handleSubmitGAS}
                                        disabled={submitStatus === 'loading'}
                                        className={`flex-1 md:flex-none text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-md transition-all ${
                                            submitStatus === 'loading' ? 'bg-indigo-400' : 'bg-indigo-600 hover:bg-indigo-700'
                                        }`}
                                    >
                                        {submitStatus === 'loading' ? '☁️ 提交中...' : '☁️ 提交云端表格'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
